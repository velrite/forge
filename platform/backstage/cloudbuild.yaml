steps:
  - name: 'node:24-trixie-slim'
    entrypoint: bash
    args:
      - -c
      - |
        export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        corepack enable
        yarn install --immutable
        yarn tsc
        yarn build:backend

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'packages/backend/Dockerfile', '-t', '${_IMAGE}', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']

images:
  - '${_IMAGE}'

substitutions:
  _IMAGE: 'us-central1-docker.pkg.dev/forge-platform-11124/forge-images/backstage:latest'

timeout: '1200s'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
