steps:
  - name: 'node:24-trixie-slim'
    entrypoint: bash
    env:
      - 'YARN_ENABLE_IMMUTABLE_INSTALLS=false'
    args:
      - -c
      - |
        export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        corepack enable
        yarn install
        yarn tsc
        yarn build:backend

  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args: ['build', '-f', 'packages/backend/Dockerfile', '-t', '${_IMAGE_BASE}:${_TAG}', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_BASE}:${_TAG}']

images:
  - '${_IMAGE_BASE}:${_TAG}'

substitutions:
  _IMAGE_BASE: 'us-central1-docker.pkg.dev/forge-platform-11124/forge-images/backstage'
  _TAG: 'manual'

timeout: '1200s'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
