# Forge platform pipeline - builds/pushes the Backstage image via
# Workload Identity Federation (ADR-012). No stored GCP credentials.
#
# IMPORTANT: gcloud builds submit's automatic local-directory packaging
# has a confirmed, reproducible permission-check failure under WIF
# external-account credentials, independent of target bucket IAM
# (verified against two separate buckets, one fully self-managed).
# Workaround: package and upload the source ourselves with plain
# storage operations, then point builds submit at the GCS object
# directly instead of a local directory.

stages:
  - test
  - security
  - push

variables:
  IMAGE_BASE: us-central1-docker.pkg.dev/forge-platform-11124/forge-images/backstage
  GCP_WIF_PROVIDER: projects/623383904945/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-provider
  GCP_SERVICE_ACCOUNT: gitlab-ci-forge@forge-platform-11124.iam.gserviceaccount.com
  GCS_SOURCE_BUCKET: forge-platform-11124-gitlab-ci-source

lint_and_test:
  stage: test
  image: node:24-trixie-slim
  script:
    - cd platform/backstage
    - export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
    - export YARN_ENABLE_IMMUTABLE_INSTALLS=false
    - corepack enable
    - yarn install
    - yarn tsc --noEmit
  rules:
    - changes:
        - platform/backstage/**/*

dependency_scan:
  stage: security
  image: node:24-trixie-slim
  script:
    - cd platform/backstage
    - export YARN_ENABLE_IMMUTABLE_INSTALLS=false
    - corepack enable
    - yarn npm audit --severity high || echo "Audit findings present - review before merge, not yet gate-blocking"
  rules:
    - changes:
        - platform/backstage/**/*
  allow_failure: true

build_and_push:
  stage: push
  image: google/cloud-sdk:slim
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/${GCP_WIF_PROVIDER}
  script:
    - echo "${GCP_ID_TOKEN}" > /tmp/gitlab_token
    - gcloud iam workload-identity-pools create-cred-config
        "${GCP_WIF_PROVIDER}"
        --service-account="${GCP_SERVICE_ACCOUNT}"
        --output-file=/tmp/gcp-creds.json
        --credential-source-file=/tmp/gitlab_token
    - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-creds.json
    - gcloud auth login --cred-file="${GOOGLE_APPLICATION_CREDENTIALS}"
    - gcloud config set project forge-platform-11124
    - cd platform/backstage
    - TAG="${CI_COMMIT_SHORT_SHA}"
    - echo "=== Packaging source ourselves (bypasses builds submit's problematic auto-upload) ==="
    - tar --exclude='.git' -czf /tmp/source.tar.gz .
    - gcloud storage cp /tmp/source.tar.gz "gs://${GCS_SOURCE_BUCKET}/source/${TAG}.tar.gz"
    - echo "=== Submitting build against the already-uploaded object ==="
    - gcloud builds submit --config=cloudbuild.yaml --substitutions=_TAG="${TAG}" "gs://${GCS_SOURCE_BUCKET}/source/${TAG}.tar.gz"
    - echo "Built and pushed ${IMAGE_BASE}:${TAG}"
  rules:
    - changes:
        - platform/backstage/**/*
      if: '$CI_COMMIT_BRANCH == "main"'
