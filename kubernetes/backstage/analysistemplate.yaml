apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: backstage-readiness-check
  namespace: forge-platform
spec:
  metrics:
    - name: pods-ready
      interval: 15s
      count: 4
      successCondition: result >= 1
      failureLimit: 2
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
          query: |
            kube_deployment_status_replicas_ready{namespace="forge-platform",deployment="backstage"}
            /
            kube_deployment_spec_replicas{namespace="forge-platform",deployment="backstage"}
